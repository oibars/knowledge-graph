[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graph"
version = "2.0.0"
description = "Hybrid knowledge graph with NetworkX + SQLite for AI agent memory, MCP server, and Claude Code agent indexing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "structlog>=24.0",
    "pydantic>=2.0",
    "fastapi>=0.115.0",
    "anthropic>=0.52.0",
    "mcp>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kg-mcp = "knowledge_graph.mcp_server:main"
kg-index-agents = "knowledge_graph.agent_indexer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
